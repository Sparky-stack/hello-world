name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate OpenChoreo manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Validate OpenChoreo manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py

  go:
    needs: validate-manifests
    uses: koorikla/ci/.github/workflows/go.yaml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  bump:
    needs: go
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump OpenChoreo Workload
        env:
          NEW_IMAGE: ${{ needs.go.outputs.image }}
          NEW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('deploy/openchoreo/workload.yaml')
          text = p.read_text()
          text, n_commit = re.subn(r'^(\s*commit:\s*).*$', rf'\g<1>"{os.environ["NEW_COMMIT"]}"', text, count=1, flags=re.M)
          text, n_image = re.subn(r'^(\s*image:\s*).*$', rf'\g<1>{os.environ["NEW_IMAGE"]}', text, count=1, flags=re.M)
          assert n_commit == 1 and n_image == 1, (n_commit, n_image)
          p.write_text(text)
          PY

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Validate bumped manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py

      - name: Commit and push Workload bump
        env:
          SHORT_SHA: ${{ needs.go.outputs.short_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet deploy/openchoreo/workload.yaml; then
            echo 'No workload changes to commit'
            exit 0
          fi
          git add deploy/openchoreo/workload.yaml
          git commit -m "chore(deploy): bump hello-world image to ${SHORT_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin main
