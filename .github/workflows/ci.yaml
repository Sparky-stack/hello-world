name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -v ./...

      - uses: astral-sh/setup-uv@v10

      - name: Validate OpenChoreo manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image metadata
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          short_sha=${SHA:0:7}
          repo="ghcr.io/${owner}/hello-world"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.repo }}:main
          build-args: |
            VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump OpenChoreo Workload
        env:
          NEW_IMAGE: ${{ needs.build.outputs.image }}
          NEW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('deploy/openchoreo/workload.yaml')
          text = p.read_text()
          text, n_commit = re.subn(r'^(\s*commit:\s*).*$', rf'\g<1>"{os.environ["NEW_COMMIT"]}"', text, count=1, flags=re.M)
          text, n_image = re.subn(r'^(\s*image:\s*).*$', rf'\g<1>{os.environ["NEW_IMAGE"]}', text, count=1, flags=re.M)
          assert n_commit == 1 and n_image == 1, (n_commit, n_image)
          p.write_text(text)
          PY

      - uses: astral-sh/setup-uv@v10

      - name: Validate bumped manifests
        run: uv run --with pyyaml --with jsonschema python3 hack/validate-manifests.py

      - name: Commit and push Workload bump
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet deploy/openchoreo/workload.yaml; then
            echo 'No workload changes to commit'
            exit 0
          fi
          git add deploy/openchoreo/workload.yaml
          git commit -m "chore(deploy): bump hello-world image to ${SHORT_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin main
