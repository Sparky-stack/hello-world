# OpenChoreo Component: the developer-facing definition of hello-world.
#
# No metadata.namespace on purpose: the platform's Argo CD Application sets the
# destination namespace (the OpenChoreo org namespace, `default`).
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: hello-world
  annotations:
    openchoreo.dev/display-name: Hello World
    openchoreo.dev/description: Tiny Go HTTP service used to exercise the platform end to end
    # PR preview environments (koorikla/platform docs/preview-environments.md): every open pull request gets its own
    # OpenChoreo environment pr-<n>-hello-world running the in-cluster build of the PR head; the URL appears on the PR
    # as commit status openchoreo/preview. Removed when the PR closes or after the platform TTL. Remove to opt out.
    platform.koorikla.io/preview-environments: enabled
spec:
  owner:
    projectName: demo # immutable; Project is created by the platform (tenants/demo.yaml)
  componentType:
    # Upstream 1.3.3 default ClusterComponentType `service` (workloadType deployment).
    # Immutable after creation.
    kind: ClusterComponentType
    name: deployment/service
  # autoDeploy: true -> on every Component/Workload change the OpenChoreo
  # controller cuts an immutable ComponentRelease (hello-world-<hash>) from the
  # *platform's* ClusterComponentType and points the first pipeline environment's
  # ReleaseBinding (development) at it. CI only bumps the image in workload.yaml,
  # so `main` is continuously deployed to development. Staging and production are
  # pinned in Git (release-bindings/*.yaml) and only move via a reviewed PR.
  autoDeploy: true
  # Build: OpenChoreo workflow plane (default build path, koorikla/platform docs/build-plane.md). ClusterWorkflow `go`
  # runs koorikla/ci's scripts/go/check.sh + scans, builds a multi-arch image with rootless BuildKit, pushes it to the
  # platform registry (Harbor apps/demo/hello-world), signs and attests it, then commits the image ref into
  # workload.yaml - Argo CD deploys that commit. Trigger: every new commit on main (autoBuild: the platform's auto-build
  # trigger, one WorkflowRun hello-world-<sha12> per commit; poll locally, GitHub App webhook in cloud installations),
  # or Backstage "Build". GitHub Actions (.github/workflows/ci.yaml) is the optional alternative: set repository
  # variable IMAGE_BUILDER=github-actions AND autoBuild: false to let it build and bump instead.
  autoBuild: true
  workflow:
    kind: ClusterWorkflow
    name: go
    parameters:
      repository:
        url: https://github.com/koorikla/hello-world.git
        revision:
          branch: main
        appPath: "."
      docker:
        context: "."
        filePath: Dockerfile
      platforms: linux/amd64,linux/arm64   # the Dockerfile cross-compiles: no emulation needed
