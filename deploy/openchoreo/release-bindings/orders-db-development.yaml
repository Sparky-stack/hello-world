# ResourceReleaseBinding: runs the orders-db Resource in `development` (first environment of the pipeline).
#
# Development only, on purpose: production cells cannot run the CloudNativePG pods yet (koorikla/platform#327), and
# staging/production ReleaseBindings pin a ComponentRelease cut before this database existed, so they do not wait for
# it. Before promoting a ComponentRelease that depends on orders-db, add orders-db-<env>.yaml for that environment
# (production: highAvailability: true and backup.enabled: true, platform policy).
#
# spec.resourceRelease: OpenChoreo 1.3.3 has no auto-deploy for Resources, so the release is pinned here. The name is a
# deterministic hash of the ClusterResourceType spec and orders-db's parameters (same on every clean bootstrap). Read it
# with: kubectl --context k3d-platform-mgmt -n default get resource orders-db -o jsonpath='{.status.latestRelease.name}'
# A platform change to the postgresql type or a change of orders-db's parameters cuts a new release: update the pin.
apiVersion: openchoreo.dev/v1alpha1
kind: ResourceReleaseBinding
metadata:
  name: orders-db-development
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after the Resource: the platform's admission check reads it
spec:
  owner:
    projectName: demo
    resourceName: orders-db
  environment: development
  resourceRelease: orders-db-7bbd4b8fc7
  retainPolicy: Delete # development data is disposable; unbinding deletes the database
  resourceTypeEnvironmentConfigs:
    size: S
    storageGiB: 10
