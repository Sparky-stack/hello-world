# ReleaseBinding for `production`.
#
# PROMOTION = a PR that sets spec.releaseName to the ComponentRelease currently
# running in staging (see README "Promotion"). Until it is set, this binding
# stays pending (ReleaseSynced=False, ComponentReleaseNotFound).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: hello-world-production
spec:
  owner:
    projectName: demo
    componentName: hello-world
  environment: production
  releaseName: hello-world-77ff9dc697
  # replicas >= 2, requests and the KEDA floor >= 2 are required in production (platform policy
  # openchoreo-workload-resilience-enforce); the PodDisruptionBudget follows from replicas >= 2.
  componentTypeEnvironmentConfigs:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  traitEnvironmentConfigs:
    scaler:
      minReplicas: 2
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from production
