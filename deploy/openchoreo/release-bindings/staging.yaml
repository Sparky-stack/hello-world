# ReleaseBinding for `staging`.
#
# PROMOTION = a PR that sets spec.releaseName to the ComponentRelease currently
# running in development (see README "Promotion"). Until it is set, this
# binding stays pending (ReleaseSynced=False, ComponentReleaseNotFound).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: hello-world-staging
spec:
  owner:
    projectName: demo
    componentName: hello-world
  environment: staging
  releaseName: hello-world-77ff9dc697
  # Two replicas so the platform's PodDisruptionBudget (staging + production) keeps one pod through a node drain;
  # the KEDA floor matches (production denies autoscalers below 2, staging audits).
  componentTypeEnvironmentConfigs:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
  traitEnvironmentConfigs:
    scaler:
      minReplicas: 2
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from staging
