# ReleaseBinding for `staging`.
#
# PROMOTION = a PR that sets spec.releaseName to the ComponentRelease currently
# running in development (see README "Promotion"). Until it is promoted, this
# ReleaseBinding stays dormant (no releaseName -> nothing deployed to staging).
apiVersion: openchoreo.dev/v1alpha1
kind: ReleaseBinding
metadata:
  name: hello-world-staging
spec:
  owner:
    projectName: default
    componentName: hello-world
  environment: staging
  componentTypeEnvOverrides:
    replicas: 1
  workloadOverrides:
    container:
      env:
        - key: GREETING
          value: hello from staging
