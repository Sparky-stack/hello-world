# OpenChoreo Workload: the runtime contract (image, endpoints, config).
# spec.container.image and spec.source.commit are bumped by CI on every push to
# main (.github/workflows/ci.yaml, job `bump`). Do not edit them by hand.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/koorikla/hello-world
    branch: main
    commit: "d5d74db8493eeb8e5ac8f9c1ef4a4990c3916d90"
  container:
    image: ghcr.io/koorikla/hello-world:d5d74db
    env:
      - key: GREETING
        value: hello
  endpoints:
    http:
      type: HTTP
      port: 8080
      # external = routed through the environment's external gateway; requires
      # gateway.ingress.external on the Environment/DataPlane.
      visibility: [external]
