# OpenChoreo Workload: the runtime contract (image, endpoints, config).
# spec.container.image (<image>:<tag>@sha256:<digest>) and spec.source.commit are written by the build: the OpenChoreo
# workflow (component.yaml spec.workflow, step gitops) or, if IMAGE_BUILDER=github-actions,
# .github/workflows/ci.yaml job `bump`. Do not edit them by hand.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/koorikla/hello-world
    branch: main
    commit: "1b08d359b400d7cab8136bd0be81f43172f19b31"
  container:
    image: harbor.openchoreo.localhost:9443/apps/demo/hello-world:1b08d35@sha256:56654ce09dd6f6dd3e8bbd81115217c659a81f37f8974620c51536238440ba7e
    env:
      - key: GREETING
        value: hello
      # From OpenBao via the SecretReference in greeting-secret.yaml (same name); no value in git.
      - key: GREETING_SECRET
        valueFrom:
          secretKeyRef:
            name: hello-world-greeting
            key: greeting
  endpoints:
    http:
      type: HTTP
      port: 8080
      # external = routed through the environment's external gateway; requires
      # gateway.ingress.external on the Environment/DataPlane.
      visibility: [external]
  dependencies:
    resources:
      # The orders-db Resource (orders-db.yaml). In each environment OpenChoreo resolves its outputs from that
      # environment's ResourceReleaseBinding: host/port/database as plain values, username/password/uri as
      # secretKeyRefs to the database's Secret <xr>-app in the cell namespace (the values never leave the data plane).
      # The names are libpq's, so any Postgres client finds the database without configuration. GET /db uses them.
      # A ComponentRelease with this dependency waits in every environment without an orders-db binding.
      - ref: orders-db
        envBindings:
          host: PGHOST
          port: PGPORT
          database: PGDATABASE
          username: PGUSER
          password: PGPASSWORD
          uri: DATABASE_URL
