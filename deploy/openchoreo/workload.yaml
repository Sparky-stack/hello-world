# The OpenChoreo Workload: image, config, endpoint, database. The build writes image and commit.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/Sparky-stack/hello-world
    branch: main
    commit: "3f79eccbd671c9b1f112cd6dbaa9b79d20c98875"
  container:
    image: harbor.openchoreo.localhost:9443/apps/demo/hello-world:3f79ecc@sha256:6c75180a8846bb800775bd2357365faceebd5c7bf1d4385e3d5e47f8ff66c3a5
    env:
      - key: GREETING
        value: hello
      - key: GREETING_SECRET
        valueFrom:
          secretKeyRef:
            name: hello-world-greeting # greeting-secret.yaml (value in OpenBao)
            key: greeting
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    resources:
      - ref: orders-db # orders-db.yaml; libpq variable names, GET /db uses them
        envBindings:
          host: PGHOST
          port: PGPORT
          database: PGDATABASE
          username: PGUSER
          password: PGPASSWORD
          uri: DATABASE_URL
