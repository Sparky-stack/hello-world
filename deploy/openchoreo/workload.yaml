# OpenChoreo Workload: the runtime contract (image, endpoints, config).
# spec.container.image (<image>:<tag>@sha256:<digest>) and spec.source.commit are
# bumped by CI on every push to main (.github/workflows/ci.yaml, job `bump`).
# Do not edit them by hand.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/koorikla/hello-world
    branch: main
    commit: "df72ab8c1a9d635f629acb55cc1efd84b83201f9"
  container:
    image: ghcr.io/koorikla/hello-world:df72ab8@sha256:889643d395abe5afdae94db0f9790b5c0f922532eefc94d32a691927f87d7988
    env:
      - key: GREETING
        value: hello
  endpoints:
    http:
      type: HTTP
      port: 8080
      # external = routed through the environment's external gateway; requires
      # gateway.ingress.external on the Environment/DataPlane.
      visibility: [external]
