# The OpenChoreo Workload: image, config, endpoint, database. The build writes image and commit.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/koorikla/hello-world
    branch: main
    commit: "e0ded57eb163e0e14f00ff162a00f4597b7d0de0"
  container:
    image: harbor.openchoreo.localhost:9443/apps/demo/hello-world:e0ded57@sha256:d66c9f2cbfa548ece2f1b1faaf2c596dd3e4d1e04aa6b9174ed2c96090db499e
    env:
      - key: GREETING
        value: hello
      - key: GREETING_SECRET
        valueFrom:
          secretKeyRef:
            name: hello-world-greeting # greeting-secret.yaml (value in OpenBao)
            key: greeting
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    resources:
      - ref: orders-db # orders-db.yaml; libpq variable names, GET /db uses them
        envBindings:
          host: PGHOST
          port: PGPORT
          database: PGDATABASE
          username: PGUSER
          password: PGPASSWORD
          uri: DATABASE_URL
