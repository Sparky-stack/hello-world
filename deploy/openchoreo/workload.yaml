# The OpenChoreo Workload: image, config, endpoint, database. The build writes image and commit.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/Sparky-stack/hello-world
    branch: main
    commit: "047975ed13f8407440fd983ac7fd257618d644e5"
  container:
    image: harbor.openchoreo.localhost:9443/apps/demo/hello-world:047975e@sha256:06326e3a08c37620b6765aaf3e9baf7753e6a98563287904e384136114e4b824
    env:
      - key: GREETING
        value: hello
      - key: GREETING_SECRET
        valueFrom:
          secretKeyRef:
            name: hello-world-greeting # greeting-secret.yaml (value in OpenBao)
            key: greeting
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility: [external]
  dependencies:
    resources:
      - ref: orders-db # orders-db.yaml; libpq variable names, GET /db uses them
        envBindings:
          host: PGHOST
          port: PGPORT
          database: PGDATABASE
          username: PGUSER
          password: PGPASSWORD
          uri: DATABASE_URL
