# OpenChoreo Workload: the runtime contract (image, endpoints, config).
# spec.container.image (<image>:<tag>@sha256:<digest>) and spec.source.commit are written by the build: the OpenChoreo
# workflow (component.yaml spec.workflow, step gitops) or, if IMAGE_BUILDER=github-actions,
# .github/workflows/ci.yaml job `bump`. Do not edit them by hand.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: hello-world-workload
spec:
  owner:
    projectName: demo
    componentName: hello-world
  source:
    repository: https://github.com/koorikla/hello-world
    branch: main
    commit: "199e3757a902b837c104830e89f8e235c184540a"
  container:
    image: ghcr.io/koorikla/hello-world:199e375@sha256:1552408ce8f70bc95aa5b1dcc8dd4684d6e238109b904153fd69ffdfc864fce6
    env:
      - key: GREETING
        value: hello
  endpoints:
    http:
      type: HTTP
      port: 8080
      # external = routed through the environment's external gateway; requires
      # gateway.ingress.external on the Environment/DataPlane.
      visibility: [external]
